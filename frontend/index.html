<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <title>Content Management System</title>
</head>
<body class="flex">
  <div class="w-64 h-screen bg-gray-800 text-white p-4">
    <h1 class="text-2xl font-bold mb-8">CMS Menu</h1>
    <nav>
      <a href="#" id="upload-link" class="block py-2 px-4 rounded hover:bg-gray-700">Upload Image</a>
      <a href="#" id="dashboard-link" class="block py-2 px-4 rounded hover:bg-gray-700">Dashboard</a>
      <a href="#" id="configure-link" class="block py-2 px-4 rounded hover:bg-gray-700">Configure Image</a>
    </nav>
  </div>

  <div id="content-area" class="flex-1 p-8">
    <div id="upload-view">
      <h2 class="text-2xl font-semibold mb-2">Upload Image</h2>
      <div class="border p-4 rounded-lg">
        <input type="file" id="imageInput" class="block w-full text-sm text-gray-500
          file:mr-4 file:py-2 file:px-4
          file:rounded-full file:border-0
          file:text-sm file:font-semibold
          file:bg-violet-50 file:text-violet-700
          hover:file:bg-violet-100
        "/>
        <button id="uploadButton" class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Upload
        </button>
      </div>
      <h2 class="text-2xl font-semibold mt-8 mb-2">Image Gallery</h2>
      <div id="imageGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Images will be loaded here -->
      </div>
    </div>

    <div id="dashboard-view" class="hidden">
      <h2 class="text-2xl font-semibold mb-2">Dashboard</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded-lg shadow">
          <h3 class="text-lg font-semibold">Total Players</h3>
          <p class="text-3xl">--</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <h3 class="text-lg font-semibold">Player Return Rate</h3>
          <p class="text-3xl">--%</p>
        </div>
      </div>
    </div>

    <div id="configure-view" class="hidden">
      <h2 class="text-2xl font-semibold mb-2">Configure Image</h2>
      <div id="configureImageGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Checkbox-enabled images will be loaded here -->
      </div>
      <button id="submitConfiguration" class="mt-4 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
        Submit Configuration
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
