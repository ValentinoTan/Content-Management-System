<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <title>Content Management System</title>
</head>
<body class="flex">
  <div class="w-64 min-h-screen bg-gray-800 text-white p-4">
    <h1 class="text-2xl font-bold mb-8">CMS Menu</h1>
    <nav>
      <a href="#" id="upload-link" class="block py-2 px-4 rounded hover:bg-gray-700">Upload Image</a>
      <a href="#" id="dashboard-link" class="block py-2 px-4 rounded hover:bg-gray-700">Dashboard</a>
      <a href="#" id="sessions-link" class="block py-2 px-4 rounded hover:bg-gray-700">Sessions</a>
    </nav>
  </div>

  <div id="content-area" class="flex-1 p-8">
    <div id="upload-view">
      <h2 class="text-2xl font-semibold mb-2">Upload Image</h2>
      <div class="border p-4 rounded-lg">
        <input type="file" id="imageInput" class="block w-full text-sm text-gray-500
          file:mr-4 file:py-2 file:px-4
          file:rounded-full file:border-0
          file:text-sm file:font-semibold
          file:bg-violet-50 file:text-violet-700
          hover:file:bg-violet-100
        "/>
        <button id="uploadButton" class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          Upload
        </button>
      </div>
      <h2 class="text-2xl font-semibold mt-8 mb-2">Image Gallery</h2>
      <div id="imageGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Images will be loaded here -->
      </div>
    </div>

    <div id="dashboard-view" class="hidden">
      <h2 class="text-2xl font-semibold mb-2">Dashboard</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded-lg shadow">
          <h3 class="text-lg font-semibold">Total Players</h3>
          <p class="text-3xl">--</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow">
          <h3 class="text-lg font-semibold">Player Return Rate</h3>
          <p class="text-3xl">--%</p>
        </div>
      </div>
    </div>

    <div id="sessions-view" class="hidden">
      <h2 class="text-2xl font-semibold mb-2">Sessions</h2>
      <button id="create-session-btn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mb-4">
        Create New Session
      </button>
      <div id="sessions-list">
        <!-- Sessions will be listed here -->
      </div>
    </div>

    <div id="create-session-view" class="hidden">
      <h2 class="text-2xl font-semibold mb-2">Create New Session</h2>
      <div class="mb-4">
        <label for="session-name-input" class="block text-gray-700 text-sm font-bold mb-2">Session Name:</label>
        <input type="text" id="session-name-input" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
      </div>
      <h3 class="text-xl font-semibold mb-2">Select 3 Images</h3>
      <div id="image-selection-gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-4">
        <!-- Images for selection will be loaded here -->
      </div>
      <div id="image-description-fields">
        <!-- Description fields for selected images will be added here -->
      </div>
      <button id="save-session-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
        Save Session
      </button>
      <button id="cancel-session-btn" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
        Cancel
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
